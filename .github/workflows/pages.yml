name: Publish classroom preview

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: classroom-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          repository: yulong3327-dotcom/oxygen-lab-3d
          ref: 4b5c67d0aa65113d78ac34f8db82a918fdf7bdb2
          path: oxygen-lab-3d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node source/build-preview.mjs site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: publish
